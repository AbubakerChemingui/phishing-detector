[pytest]
# The 1604 warnings were one repeated, known-benign upstream message:
# joblib.numpy_pickle:207 DeprecationWarning - "Setting the shape on a NumPy
# array has been deprecated in NumPy 2.5." It fires once per array while
# unpickling the pre-existing .pkl artifacts (200-tree RandomForest + others
# across 18 tests). It comes from inside joblib's unpickler, not from our
# code, and has zero effect on inference. Filter only that exact message;
# any OTHER warning class must still surface loudly.
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
